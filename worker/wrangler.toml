name = "austria-dashboard"
main = "src/index.ts"
compatibility_date = "2026-07-01"
# 對外只留 austria-dashboard.chougaku.workers.dev；每個版本各自的預覽網址關掉
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "austria-trip"
database_id = "094f407f-4292-48bf-81d1-6ab39ce5ac72"

[vars]
GH_OWNER = "Chougaku"
GH_REPO = "Austria-vault"
GH_BRANCH = "main"
GH_ITINERARY_PATH = "wiki/dashboard/每日行程.md"
# 前端網址白名單（逗號分隔）；綁了自訂網域後把它加進來
ALLOWED_ORIGINS = "https://austria.pages.dev,https://chougaku.github.io"
